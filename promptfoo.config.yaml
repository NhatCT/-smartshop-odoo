# Promptfoo Evaluation Harness — SmartShop Odoo 19 AI Gateway
# Chạy: npx promptfoo eval
# Đo 4 chỉ số: Tool Called Accuracy, Tool Count Efficiency, Zero Redundant Asks, Output Format Adherence

description: "SmartShop Odoo 19 AI Gateway — Quality Benchmark"

prompts:
  - "Bạn là trợ lý AI Odoo. Trả lời bằng tiếng Việt. Với câu hỏi nghiệp vụ, trả lời theo cấu trúc 3 mục: ### 📋 KẾT LUẬN, ### 📊 DỮ LIỆU THỰC TẾ, ### 🚀 BƯỚC TIẾP THEO. Người dùng: {{text}}"

providers:
  - id: anthropic:messages:claude-haiku-4-5-20251001
    config:
      max_tokens: 1500

defaultTest:
  assert:
    - type: contains
      value: "### 📋 KẾT LUẬN"
    - type: contains
      value: "### 📊 DỮ LIỆU THỰC TẾ"
    - type: contains
      value: "### 🚀 BƯỚC TIẾP THEO"

tests:
  # ─── 1. TOOL CALLED ACCURACY ───
  - description: "Tra cứu tồn kho — phải gọi tool kiểm kho"
    vars:
      text: "Kiểm tra tồn kho sản phẩm iPhone 15"
    assert:
      - type: contains
        value: "tồn kho"
      - type: contains
        value: "KẾT LUẬN"

  - description: "Tạo đơn hàng — phải gọi tool tạo đơn"
    vars:
      text: "Tạo đơn hàng cho khách hàng Alice với 2 sản phẩm iPhone 15"
    assert:
      - type: contains
        value: "đơn"
      - type: contains
        value: "KẾT LUẬN"

  - description: "Tra cứu sản phẩm — phải gọi tool tìm sản phẩm"
    vars:
      text: "Giá của sản phẩm MacBook Pro là bao nhiêu?"
    assert:
      - type: contains
        value: "KẾT LUẬN"

  # ─── 2. TOOL COUNT EFFICIENCY ───
  - description: "Không hỏi thừa — Odoo tự tra giá bán"
    vars:
      text: "Tạo báo giá cho khách hàng Bob với 1 sản phẩm Samsung Galaxy"
    assert:
      - type: not-contains
        value: "giá bán là bao nhiêu"
      - type: not-contains
        value: "bạn muốn giá bao nhiêu"

  # ─── 3. ZERO REDUNDANT ASKS ───
  - description: "Không hỏi ngày giao — không bắt buộc cho đơn nháp"
    vars:
      text: "Tạo đơn nháp cho khách hàng Carol với 3 sản phẩm iPad"
    assert:
      - type: not-contains
        value: "ngày giao"
      - type: not-contains
        value: "khi nào giao"

  # ─── 4. OUTPUT FORMAT ADHERENCE ───
  - description: "Đúng cấu trúc 3 mục cho câu hỏi nghiệp vụ"
    vars:
      text: "Báo cáo doanh số tháng này"
    assert:
      - type: contains
        value: "### 📋 KẾT LUẬN"
      - type: contains
        value: "### 📊 DỮ LIỆU THỰC TẾ"
      - type: contains
        value: "### 🚀 BƯỚC TIẾP THEO"

  - description: "Small-talk không ép format 3 mục"
    vars:
      text: "Xin chào"
    assert:
      - type: not-contains
        value: "### 📋 KẾT LUẬN"
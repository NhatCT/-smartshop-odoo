version: '3.8'

services:
  smartshop-ai-gateway:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: smartshop-ai-gateway
    restart: always
    env_file:
      - .env
    volumes:
      - ./telegram_identity_bindings.json:/app/telegram_identity_bindings.json
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

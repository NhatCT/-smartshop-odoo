name: SmartShop Odoo 19 AI Gateway CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  audit-odoo-connection:
    name: "🔗 Kiểm tra Kết nối Odoo 19 SaaS"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Verify Core Imports & Syntax
        run: |
          python -c "import auth_gateway, telegram_bot_listener, odoo_client; print('✅ All Core Modules Compiled Successfully!')"

  docker-build-check:
    name: "🐳 Docker Build & Container Validation"
    runs-on: ubuntu-latest
    needs: audit-odoo-connection
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: smartshop-ai-gateway:latest

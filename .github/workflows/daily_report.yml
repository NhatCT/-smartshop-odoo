name: Daily Report Automation

on:
  schedule:
    # 17:45 GMT+7 (Việt Nam) = 10:45 UTC (Từ Thứ 2 đến Thứ 6)
    - cron: '45 10 * * 1-5'
  workflow_dispatch: # Cho phép nhấn nút chạy test thủ công

jobs:
  send-report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests google-generativeai

      - name: Run daily report script (Direct Automatic Mode)
        run: python daily_report.py
        env:
          GH_USERNAME: "ThanhNhat1908"
          YOUR_NAME: "Nguyễn Thành Nhật"
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
